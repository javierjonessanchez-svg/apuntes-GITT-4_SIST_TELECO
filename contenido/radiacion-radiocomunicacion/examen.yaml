# ---------- Guía «¿Qué tipo de problema es?» (página tipo-de-problema) ----------
# Solo nombres de función y de qué trata cada tipo de dato: nada de enunciados ni de código.
guia:
  arbol:
    inicio: que-piden
    nodos:
      - id: que-piden
        pregunta: '¿De qué trata lo que te piden?'
        opciones:
          - texto: 'Propagación: potencias, pérdidas, campo, distancia, K (tema 1)'
            a: prop
          - texto: 'Antenas: ganancia, desapuntamiento, diagrama, ROE (tema 2)'
            a: antena
          - texto: 'Lluvia, margen de desvanecimiento o disponibilidad (tema 3)'
            a: llu
          - texto: 'Ruido, umbral o interferencia (tema 4)'
            a: ruido
          - texto: 'Un examen entero, con varios apartados encadenados'
            resultado:
              titulo: 'Resolutores de examen completo'
              texto: 'Rellena una struct con los datos y deja que encadene los pasos e imprima cada uno. Empieza por Clasificar_trayecto para saber qué pérdida tiene el trayecto.'
              funciones: [Clasificar_trayecto, Resolver_tipoA, Resolver_tipoB, Resolver_diseno]
      - id: prop
        pregunta: '¿Qué te piden?'
        opciones:
          - texto: 'Las pérdidas del trayecto (Lb), o saber de qué tipo son'
            a: perdidas
          - texto: 'Prx, Pt, PIRE o Lb, conociendo las demás'
            resultado:
              titulo: 'Friis y sus inversas'
              texto: 'Prx = PIRE − Lb + Gr − Lr. Despeja lo que te falte: Pt, la PIRE o las pérdidas básicas.'
              funciones: [Calcular_PIRE, Calcular_Prx, Calcular_Pt, Calcular_Lb]
          - texto: 'Campo eléctrico, flujo o distancia en espacio libre'
            a: campo
          - texto: 'K, radio ficticio, horizonte o alcance con visión directa'
            resultado:
              titulo: 'Atmósfera y horizonte'
              texto: 'K sale del gradiente de refractividad; para un vano concreto usa K99,9. Con K y las alturas se calcula el horizonte de cada antena.'
              funciones: [Calcular_K, Calcular_K999, Calcular_Horizonte]
          - texto: 'Alturas mínimas de antena para despejar los obstáculos'
            resultado:
              titulo: 'Alturas de despejamiento'
              texto: 'Busca las menores alturas con v ≤ −0,78 en todo el perfil.'
              funciones: [Calcular_Alturas_despejamiento, Calcular_Lad_dif]
      - id: perdidas
        pregunta: '¿El enunciado da obstáculos (distancias y cotas)?'
        ayuda: 'Clasificar_trayecto(datos) hace estas preguntas por ti y dice el tipo y por qué.'
        opciones:
          - texto: 'Sí'
            resultado:
              titulo: 'Difracción por obstáculos (Bullington)'
              texto: 'Si ningún obstáculo tiene v > −0,78 no hay difracción (Lad = 0). Si alguno lo tiene: Lb = Lbf + Lgas + Lad,dif. Dibujar_Bullington saca la figura.'
              funciones: [Calcular_Lad_dif, Dibujar_Bullington, Calcular_Lb_std, Clasificar_trayecto]
          - texto: 'No'
            a: suelo
      - id: suelo
        pregunta: '¿Hay mar o terreno liso (σ, εr) que refleje?'
        opciones:
          - texto: 'No: enlace despejado'
            resultado:
              titulo: 'Trayecto libre'
              texto: 'Lb = Lbf + Lgas.'
              funciones: [Calcular_Lb_std]
          - texto: 'Sí'
            a: dmax
      - id: dmax
        pregunta: '¿La distancia supera el horizonte de las dos antenas (d > d_max)?'
        ayuda: 'Calcula d_max con Calcular_Horizonte.'
        opciones:
          - texto: 'Sí'
            resultado:
              titulo: 'Tierra esférica con despejamiento positivo'
              texto: 'Transhorizonte: difracción por tierra esférica. No hay función programada; solo puedes confirmar con Calcular_Horizonte que no hay visión directa.'
              funciones: [Calcular_Horizonte]
              pendiente: true
          - texto: 'No'
            a: angulo
      - id: angulo
        pregunta: '¿El ángulo rasante cumple φ ≥ φmin = (5400/f_MHz)^(1/3) mrad?'
        opciones:
          - texto: 'Sí'
            resultado:
              titulo: 'Reflexión en mar o terreno liso (dos rayos)'
              texto: 'Lb = Lbf + Lgas + Lad,ref.'
              funciones: [Calcular_Lad_ref, Calcular_Lb_std]
          - texto: 'No'
            resultado:
              titulo: 'Tierra esférica con despejamiento negativo'
              texto: 'No hay reflexión: difracción por tierra esférica. No hay función programada; Calcular_Lad_ref devuelve NaN y avisa de que no es reflexión.'
              funciones: [Calcular_Lad_ref]
              pendiente: true
      - id: campo
        pregunta: '¿Qué datos tienes y qué te piden?'
        opciones:
          - texto: 'Tengo la PIRE (o Pt, Lt, Gt) y d; piden el campo E'
            resultado:
              titulo: 'Campo en espacio libre'
              texto: 'E = √(30·PIRE)/d. El flujo sale de E²/120π.'
              funciones: [Calcular_PIRE, Calcular_Campo, Calcular_Flujo]
          - texto: 'Tengo E en dBµ a una distancia; piden Pt o la PIRE'
            resultado:
              titulo: 'PIRE necesaria para un campo'
              texto: 'La función ya trabaja con dBµ; dBu2Vm pasa a V/m si lo necesitas para otra cosa.'
              funciones: [Calcular_PIRE_campo, dBu2Vm]
          - texto: 'Tengo el campo, el flujo o Lbf; piden la distancia'
            resultado:
              titulo: 'Distancia en espacio libre'
              texto: 'Se despeja de Lbf (con f), del campo o del flujo (con la PIRE).'
              funciones: [Calcular_Distancia]
          - texto: 'Tengo el campo E; piden la Prx'
            resultado:
              titulo: 'Del campo a la potencia recibida'
              texto: 'E → Φ → Sef → Prx. La Prx por Friis sirve de comprobación.'
              funciones: [dBu2Vm, Calcular_Flujo, Calcular_Sef, Calcular_Prx_flujo]
      - id: antena
        pregunta: '¿Qué te piden de la antena?'
        opciones:
          - texto: 'La ganancia con la antena desapuntada'
            resultado:
              titulo: 'Ganancia con desapuntamiento'
              texto: 'G(θ) = Gmax − 12·(θ/θ3dB)² en el lóbulo principal. Solo cambia la antena desapuntada.'
              funciones: [Calcular_G_desapuntado]
          - texto: 'La discriminación leyendo el diagrama de radiación (RPE)'
            resultado:
              titulo: 'Discriminación del RPE'
              texto: 'Apunta puntos (ángulo, dB) de la gráfica y la función interpola.'
              funciones: [Calcular_Discriminacion]
          - texto: 'ROE, pérdidas de retorno o |s11|'
            resultado:
              titulo: 'Adaptación de la antena'
              texto: 'Dado uno de los tres, saca los otros dos y la potencia reflejada.'
              funciones: [Calcular_ROE]
          - texto: 'Ganancia, rendimiento o área efectiva'
            resultado:
              titulo: 'Ganancia, directividad y área efectiva'
              texto: 'g = η·d; con dos de los tres, la tercera. El área efectiva sale de la ganancia y de la frecuencia.'
              funciones: [Calcular_Antena, Calcular_Sef, Calcular_G_desde_Sef]
          - texto: 'La distancia de campo lejano'
            resultado:
              titulo: 'Campo lejano'
              texto: 'R = 2D²/λ con D la mayor dimensión de la antena.'
              funciones: [Calcular_Campo_Lejano]
      - id: llu
        pregunta: '¿Qué te piden?'
        opciones:
          - texto: 'La atenuación por lluvia (F0,01 o Fq)'
            a: llu-enlace
          - texto: 'Margen dinámico o potencia con atenuador, CAG o ATPC'
            resultado:
              titulo: 'Mecanismo de protección'
              texto: 'En los tres casos FM = MD. Con la PIRE en condiciones normales (CN) sacas Pt.'
              funciones: [Calcular_MD, Calcular_Pt]
          - texto: 'Qué margen hace falta, o qué % de tiempo se supera un margen'
            resultado:
              titulo: 'Margen y tiempo de lluvia'
              texto: 'Son inversas: q despejando Fq = FM, o el FM que corresponde a un U de lluvia dado.'
              funciones: [Calcular_q_lluvia, Calcular_FM_necesario]
          - texto: 'Disponibilidad, indisponibilidad de equipos o MTTR máximo'
            resultado:
              titulo: 'Disponibilidad'
              texto: 'U_total = U_lluvia + U_equipos. Con un objetivo y la U de lluvia, el MTTR máximo sale repartiendo por igual entre equipos.'
              funciones: [Calcular_U_equipos, Calcular_MTTR_max, Calcular_Disponibilidad]
          - texto: 'XPD por lluvia'
            resultado:
              titulo: 'Despolarización por lluvia'
              texto: 'En desvanecimiento máximo, Fq = FM. Válido en enlace terrenal de 8 a 35 GHz.'
              funciones: [Calcular_XPD_lluvia]
      - id: llu-enlace
        pregunta: '¿El enlace es terrenal o por satélite?'
        ayuda: 'R0,01 viene en el enunciado o sale de itur_p0837_7_annex1 con la latitud y la longitud.'
        opciones:
          - texto: 'Terrenal'
            resultado:
              titulo: 'Lluvia en enlace terrenal'
              texto: 'k y α según la frecuencia y la polarización; luego F0,01 con la longitud efectiva y Fq para otro porcentaje.'
              funciones: [Calcular_k_alfa, Calcular_F001, Calcular_Fq]
          - texto: 'Satélite'
            resultado:
              titulo: 'Lluvia en enlace por satélite'
              texto: 'Trayecto inclinado: hacen falta la elevación, la altura de la antena, la isoterma de 0 ºC y la latitud. Con |lat| < 36º y q < 1 %, Fq también necesita la elevación.'
              funciones: [Calcular_k_alfa, Calcular_F001_espacial, Calcular_Fq]
      - id: ruido
        pregunta: '¿Qué te piden?'
        opciones:
          - texto: 'La temperatura de ruido de una cadena de bloques'
            resultado:
              titulo: 'Temperatura de ruido de la cadena'
              texto: 'Una etapa pasiva de L dB tiene G = −L. Da la T a la entrada y a la salida.'
              funciones: [Calcular_T_cadena]
          - texto: 'El umbral TH, el ancho de banda o la potencia de ruido'
            resultado:
              titulo: 'Umbral del receptor'
              texto: 'TH sale referido al punto donde está T. Si la T viene dada en otro punto (por ejemplo a la salida del mezclador), llévalo con Calcular_Umbral_referido.'
              funciones: [Calcular_Umbral, Calcular_Umbral_referido]
          - texto: 'El ángulo del interferente (tres distancias)'
            resultado:
              titulo: 'Ángulo de llegada'
              texto: 'Teorema del coseno; con el ángulo se lee la discriminación en el diagrama.'
              funciones: [Calcular_angulo_triangulo, Calcular_Discriminacion]
          - texto: 'La potencia interferente o parásita, o C/I'
            resultado:
              titulo: 'Potencia interferente'
              texto: 'C/I = Prx − P_I (resta directa). Si va en polarización cruzada y lees la curva cross-polar, no sumes además el XPD de la antena.'
              funciones: [Calcular_Interferencia, Calcular_XPD_lluvia]
  filas:
    # ----- Tema 1 -----
    - {tema: Propagación, dan: 'Pt, Lt, Gt', piden: 'PIRE', funciones: [Calcular_PIRE], datos: ['Pt', 'Lt', 'Gt'], busco: ['PIRE'], estado: hecho}
    - {tema: Propagación, dan: 'PIRE, Lb, Gr, Lr', piden: 'Prx', funciones: [Calcular_Prx], datos: ['PIRE', 'Lb', 'Gr', 'Lr'], busco: ['Prx'], estado: hecho}
    - {tema: Propagación, dan: 'Prx, Lb, Gr, Lr, Gt, Lt', piden: 'Pt (o PIRE)', funciones: [Calcular_Pt], datos: ['Prx', 'Lb', 'Gr', 'Lr', 'Gt', 'Lt'], busco: ['Pt', 'PIRE'], estado: hecho}
    - {tema: Propagación, dan: 'PIRE (o Pt, Lt, Gt) y Prx', piden: 'Lb', funciones: [Calcular_Lb], datos: ['PIRE', 'Prx', 'Gr', 'Lr'], busco: ['Lb'], estado: hecho}
    - {tema: Propagación, dan: 'f, d', piden: 'Lbf y gases', funciones: [Calcular_Lb_std], datos: ['f', 'd'], busco: ['Lbf', 'gases'], estado: hecho}
    - {tema: Propagación, dan: 'f, Lbf', piden: 'd', funciones: [Calcular_Distancia], datos: ['f', 'Lbf'], busco: ['d'], estado: hecho}
    - {tema: Propagación, dan: 'PIRE (o Pt, Lt, Gt), d', piden: 'campo E (V/m y dBµ)', funciones: [Calcular_Campo], datos: ['PIRE', 'd'], busco: ['campo E'], estado: hecho}
    - {tema: Propagación, dan: 'E en dBµ a una distancia (espacio libre), G, Lt', piden: 'Pt o PIRE necesarias', funciones: [Calcular_PIRE_campo], datos: ['campo E', 'd', 'Gt', 'Lt'], busco: ['PIRE', 'Pt'], estado: hecho}
    - {tema: Propagación, dan: 'E (o Φ), PIRE', piden: 'd', funciones: [Calcular_Distancia], datos: ['campo E', 'PIRE'], busco: ['d'], estado: hecho}
    - {tema: Propagación, dan: 'E', piden: 'Φ, Sef, Prx', funciones: [dBu2Vm, Calcular_Flujo, Calcular_Sef, Calcular_Prx_flujo], datos: ['campo E', 'f', 'G'], busco: ['flujo Φ', 'Prx'], estado: hecho}
    - {tema: Propagación, dan: 'f, G', piden: 'Sef', funciones: [Calcular_Sef], datos: ['f', 'G'], busco: ['Sef'], estado: hecho}
    - {tema: Propagación, dan: 'Sef, f', piden: 'G', funciones: [Calcular_G_desde_Sef], datos: ['Sef', 'f'], busco: ['G'], estado: hecho}
    - {tema: Propagación, dan: 'geometría del trayecto (obstáculos, d, alturas)', piden: '¿qué tipo de pérdida es?', funciones: [Clasificar_trayecto], datos: ['obstáculos', 'd', 'alturas de antena'], busco: ['tipo de trayecto'], estado: hecho}
    - {tema: Propagación, dan: 'obstáculos (d, cota), alturas, K, f', piden: 'Ld (Bullington)', funciones: [Calcular_Lad_dif, Dibujar_Bullington], datos: ['obstáculos', 'alturas de antena', 'K', 'f'], busco: ['Ld (Bullington)'], estado: hecho}
    - {tema: Propagación, dan: 'obstáculos, alturas, K, f y Pt', piden: 'Prx', funciones: [Resolver_obstaculos], datos: ['obstáculos', 'alturas de antena', 'K', 'f', 'Pt'], busco: ['Prx'], estado: hecho}
    - {tema: Propagación, dan: 'obstáculos, alturas, K, f y E0 en espacio libre', piden: 'Prx', funciones: [Resolver_obstaculos], datos: ['obstáculos', 'alturas de antena', 'K', 'f', 'E0'], busco: ['Prx'], estado: hecho}
    - {tema: Propagación, dan: 'obstáculos y alturas iniciales', piden: 'alturas mínimas de antena (het1, het2)', funciones: [Calcular_Alturas_despejamiento], datos: ['obstáculos', 'alturas de antena', 'K', 'f'], busco: ['alturas mínimas'], estado: hecho}
    - {tema: Propagación, dan: 'dN/dh (o «atmósfera estándar»)', piden: 'K y radio efectivo', funciones: [Calcular_K], datos: ['dN/dh'], busco: ['K'], estado: hecho}
    - {tema: Propagación, dan: 'd ≤ 25 km al 99,9 %', piden: 'K99,9', funciones: [Calcular_K999], datos: ['d'], busco: ['K99,9'], estado: hecho}
    - {tema: Propagación, dan: 'alturas, cotas, K', piden: 'horizonte de cada antena y d_max', funciones: [Calcular_Horizonte], datos: ['alturas de antena', 'K'], busco: ['horizonte'], estado: hecho}
    - {tema: Propagación, dan: 'mar o terreno liso (σ, εr, polarización)', piden: 'dos rayos: Lad,ref', funciones: [Calcular_Lad_ref, Resolver_mar], datos: ['mar o terreno liso', 'f', 'alturas de antena', 'K'], busco: ['Lad,ref (dos rayos)'], estado: hecho}
    - {tema: Propagación, dan: 'd > d_max o φ < φmin (no hay reflexión)', piden: 'difracción por tierra esférica', funciones: [], datos: ['d mayor que d_max'], busco: ['tierra esférica'], estado: pendiente, nota: 'No hay función programada.'}
    # ----- Tema 2 -----
    - {tema: Antenas, dan: 'Gmax, θ3dB, desapuntamiento θ', piden: 'G(θ)', funciones: [Calcular_G_desapuntado], datos: ['Gmax', 'θ3dB', 'desapuntamiento'], busco: ['G(θ)'], estado: hecho}
    - {tema: Antenas, dan: 'diagrama RPE (puntos leídos de la gráfica) y ángulo', piden: 'discriminación D (dB)', funciones: [Calcular_Discriminacion], datos: ['diagrama RPE', 'ángulo'], busco: ['discriminación'], estado: hecho}
    - {tema: Antenas, dan: '|s11|, RL o ROE', piden: 'los otros dos', funciones: [Calcular_ROE], datos: ['s11, RL o ROE'], busco: ['s11, RL o ROE'], estado: hecho}
    - {tema: Antenas, dan: 'η y directividad', piden: 'ganancia', funciones: [Calcular_Antena], datos: ['η', 'directividad'], busco: ['G'], estado: hecho}
    - {tema: Antenas, dan: 'D (dimensión mayor), f', piden: 'distancia de campo lejano 2D²/λ', funciones: [Calcular_Campo_Lejano], datos: ['D de la antena', 'f'], busco: ['campo lejano'], estado: hecho}
    - {tema: Antenas, dan: 'D del lóbulo principal y del secundario o trasero', piden: 'SLL o FBR', funciones: [], datos: ['D lóbulo principal', 'D lóbulo secundario'], busco: ['SLL o FBR'], estado: mano, nota: 'Resta directa de dos valores del diagrama.'}
    # ----- Tema 3 -----
    - {tema: Desvanecimientos, dan: 'lat, lon', piden: 'R0,01 y P0', funciones: [], datos: ['lat y lon'], busco: ['R0,01'], estado: hecho, nota: 'itur_p0837_7_annex1, en datos/uit-r/p837/ (no está en funciones/).'}
    - {tema: Desvanecimientos, dan: 'f, polarización', piden: 'k, α', funciones: [Calcular_k_alfa], datos: ['f', 'polarización'], busco: ['k y α'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'f, d, R0,01, k, α (enlace terrenal)', piden: 'F0,01 (con d_eff y γR)', funciones: [Calcular_F001], datos: ['f', 'd', 'R0,01', 'k y α'], busco: ['F0,01'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'f, R0,01, k, α, cota+antena, h0 (isoterma 0 ºC), elevación, latitud (satélite)', piden: 'F0,01', funciones: [Calcular_F001_espacial], datos: ['f', 'R0,01', 'k y α', 'elevación', 'h0 y cota', 'lat'], busco: ['F0,01'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'F0,01, q %', piden: 'Fq (terrenal o satélite)', funciones: [Calcular_Fq], datos: ['F0,01', 'q %'], busco: ['Fq'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'margen FM, F0,01', piden: 'q % = U_lluvia', funciones: [Calcular_q_lluvia], datos: ['FM', 'F0,01'], busco: ['q % (U lluvia)'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'TH, Prx y mecanismo', piden: 'MD = FM', funciones: [Calcular_MD], datos: ['TH', 'Prx', 'mecanismo'], busco: ['MD', 'FM'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'TH, Lb, Gr, Lr y MD (CAG o ATPC)', piden: 'PIRE_CN, PIRE_CMD y luego Pt', funciones: [Calcular_MD, Calcular_Pt], datos: ['TH', 'Lb', 'Gr', 'Lr', 'MD'], busco: ['PIRE_CN', 'Pt'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'f, Fq', piden: 'XPD por lluvia', funciones: [Calcular_XPD_lluvia], datos: ['f', 'Fq'], busco: ['XPD lluvia'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'MTBF y MTTR de N equipos', piden: 'U_equipos', funciones: [Calcular_U_equipos], datos: ['MTBF', 'MTTR'], busco: ['U equipos'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'U objetivo, U_lluvia, MTBF, N', piden: 'MTTR máximo', funciones: [Calcular_MTTR_max], datos: ['U objetivo', 'U lluvia', 'MTBF'], busco: ['MTTR máximo'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'U_lluvia, U_equipos, objetivo', piden: 'U_total, disponibilidad, ¿cumple?', funciones: [Calcular_Disponibilidad], datos: ['U lluvia', 'U equipos', 'U objetivo'], busco: ['disponibilidad'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'objetivo de U', piden: 'FM necesario', funciones: [Calcular_FM_necesario], datos: ['U objetivo', 'F0,01', 'f'], busco: ['FM necesario'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'datos del enlace y objetivo de disponibilidad', piden: '¿qué Pt lo cumple?', funciones: [Resolver_diseno], datos: ['U objetivo', 'TH', 'MTBF', 'f', 'd'], busco: ['Pt'], estado: hecho}
    - {tema: Desvanecimientos, dan: 'R0,01 a partir de datos mensuales', piden: 'R0,01', funciones: [], datos: ['datos mensuales'], busco: ['R0,01'], estado: pendiente, nota: 'No hay función; lo normal es que el enunciado dé R0,01.'}
    # ----- Tema 4 -----
    - {tema: Ruido e interferencias, dan: 'T y G de cada etapa (diagrama de bloques), pérdidas pasivas', piden: 'T equivalente de la cadena', funciones: [Calcular_T_cadena], datos: ['T de cada etapa', 'G de cada etapa'], busco: ['T de la cadena'], estado: hecho}
    - {tema: Ruido e interferencias, dan: 'T, Rb (con FEC), M, roll-off, Eb/N0, degradación', piden: 'TH, B, N', funciones: [Calcular_Umbral], datos: ['T', 'Rb', 'M', 'roll-off', 'Eb/N0'], busco: ['TH', 'B', 'N'], estado: hecho}
    - {tema: Ruido e interferencias, dan: 'T dada en otro punto («a la salida del mezclador»)', piden: 'TH en la entrada del receptor o en la antena', funciones: [Calcular_Umbral_referido], datos: ['TH en otro punto', 'G entre puntos'], busco: ['TH referido'], estado: hecho}
    - {tema: Ruido e interferencias, dan: 'tres distancias (triángulo)', piden: 'ángulo del interferente', funciones: [Calcular_angulo_triangulo], datos: ['tres distancias'], busco: ['ángulo del interferente'], estado: hecho}
    - {tema: Ruido e interferencias, dan: 'PIRE, Lb, Gr, Lr, discriminaciones, XPD', piden: 'potencia interferente o parásita', funciones: [Calcular_Interferencia], datos: ['PIRE', 'Lb', 'Gr', 'Lr', 'D_tx y D_rx', 'XPD'], busco: ['potencia interferente'], estado: hecho}
    - {tema: Ruido e interferencias, dan: 'Prx y P_I', piden: 'C/I', funciones: [], datos: ['Prx', 'P_I'], busco: ['C/I'], estado: mano, nota: 'Resta directa: C/I = Prx − P_I.'}
  indice:
    # ----- Propagación -----
