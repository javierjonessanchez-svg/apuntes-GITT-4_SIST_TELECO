    - {tema: Propagación, funcion: Calcular_Prx, que: 'Friis: Prx = PIRE − Lb + Gr − Lr', archivo: funciones/propagacion/Calcular_Prx.m}
    - {tema: Propagación, funcion: Calcular_Pt, que: 'Inversa de Friis: Pt y PIRE necesarias para una Prx dada', archivo: funciones/propagacion/Calcular_Pt.m}
    - {tema: Propagación, funcion: Calcular_Lb, que: 'Pérdidas básicas a partir de lo que se recibe', archivo: funciones/propagacion/Calcular_Lb.m}
    - {tema: Propagación, funcion: Calcular_Lb_std, que: 'Espacio libre y gases en atmósfera estándar', archivo: funciones/propagacion/Calcular_Lb_std.m}
    - {tema: Propagación, funcion: Calcular_Campo, que: 'Campo en espacio libre (V/m y dBµ)', archivo: funciones/propagacion/Calcular_Campo.m}
    - {tema: Propagación, funcion: Calcular_PIRE_campo, que: 'PIRE y Pt para producir un campo E (dBµ) a una distancia', archivo: funciones/propagacion/Calcular_PIRE_campo.m}
    - {tema: Propagación, funcion: Calcular_Distancia, que: 'd despejada de Lbf, del campo o del flujo', archivo: funciones/propagacion/Calcular_Distancia.m}
    - {tema: Propagación, funcion: Calcular_Flujo, que: 'Densidad de flujo Φ = E²/120π', archivo: funciones/propagacion/Calcular_Flujo.m}
    - {tema: Propagación, funcion: Calcular_Sef, que: 'Área efectiva de la antena', archivo: funciones/propagacion/Calcular_Sef.m}
    - {tema: Propagación, funcion: Calcular_Prx_flujo, que: 'Prx a partir del flujo y del área efectiva', archivo: funciones/propagacion/Calcular_Prx_flujo.m}
    - {tema: Propagación, funcion: Calcular_K, que: 'K y radio ficticio; dice si es super o subrefractiva', archivo: funciones/propagacion/Calcular_K.m}
    - {tema: Propagación, funcion: Calcular_K999, que: 'K superado el 99,9 % del peor mes', archivo: funciones/propagacion/Calcular_K999.m}
    - {tema: Propagación, funcion: Calcular_Horizonte, que: 'Horizonte de cada antena y d_max de visión directa', archivo: funciones/propagacion/Calcular_Horizonte.m}
    - {tema: Propagación, funcion: Calcular_Lcuch, que: 'Pérdidas en filo de cuchillo J(v)', archivo: funciones/propagacion/Calcular_Lcuch.m}
    - {tema: Propagación, funcion: Calcular_Lad_dif, que: 'Bullington con varios obstáculos', archivo: funciones/propagacion/Calcular_Lad_dif.m}
    - {tema: Propagación, funcion: Dibujar_Bullington, que: 'Figura del perfil, el rayo y el obstáculo equivalente', archivo: funciones/propagacion/Dibujar_Bullington.m}
    - {tema: Propagación, funcion: Calcular_Alturas_despejamiento, que: 'Alturas de antena mínimas con v ≤ −0,78 en todo el perfil', archivo: funciones/propagacion/Calcular_Alturas_despejamiento.m}
    - {tema: Propagación, funcion: Calcular_Lad_ref, que: 'Dos rayos: criterio de reflexión y Lad,ref (NaN si no hay reflexión)', archivo: funciones/propagacion/Calcular_Lad_ref.m}
    # ----- Antenas -----
    - {tema: Antenas, funcion: Calcular_G_desapuntado, que: 'G(θ) en el lóbulo principal con desapuntamiento', archivo: funciones/antenas/Calcular_G_desapuntado.m}
    - {tema: Antenas, funcion: Calcular_Discriminacion, que: 'Discriminación del RPE interpolando los puntos leídos de la gráfica', archivo: funciones/antenas/Calcular_Discriminacion.m}
    - {tema: Antenas, funcion: Calcular_ROE, que: 's11, pérdidas de retorno y ROE, uno a partir de otro', archivo: funciones/antenas/Calcular_ROE.m}
    - {tema: Antenas, funcion: Calcular_Antena, que: 'g = η·d (dos de tres) y área efectiva', archivo: funciones/antenas/Calcular_Antena.m}
    - {tema: Antenas, funcion: Calcular_G_desde_Sef, que: 'Ganancia a partir del área efectiva', archivo: funciones/antenas/Calcular_G_desde_Sef.m}
    - {tema: Antenas, funcion: Calcular_Campo_Lejano, que: 'Distancia de campo lejano 2D²/λ', archivo: funciones/antenas/Calcular_Campo_Lejano.m}
    # ----- Desvanecimientos -----
    - {tema: Desvanecimientos, funcion: Calcular_k_alfa, que: 'Coeficientes k y α de la lluvia (UIT-R P.838)', archivo: funciones/desvanecimientos/Calcular_k_alfa.m}
    - {tema: Desvanecimientos, funcion: Calcular_F001, que: 'F0,01 de un enlace terrenal', archivo: funciones/desvanecimientos/Calcular_F001.m}
    - {tema: Desvanecimientos, funcion: Calcular_F001_espacial, que: 'F0,01 de un enlace por satélite (trayecto inclinado)', archivo: funciones/desvanecimientos/Calcular_F001_espacial.m}
    - {tema: Desvanecimientos, funcion: Calcular_Fq, que: 'Atenuación por lluvia superada el q % (terrenal o satélite)', archivo: funciones/desvanecimientos/Calcular_Fq.m}
    - {tema: Desvanecimientos, funcion: Calcular_q_lluvia, que: '% de tiempo en que la lluvia supera un margen (U_lluvia)', archivo: funciones/desvanecimientos/Calcular_q_lluvia.m}
    - {tema: Desvanecimientos, funcion: Calcular_FM_necesario, que: 'Margen que hace falta para un U_lluvia admitido', archivo: funciones/desvanecimientos/Calcular_FM_necesario.m}
    - {tema: Desvanecimientos, funcion: Calcular_MD, que: 'Atenuador, CAG o ATPC: MD = FM, PIRE en CN y en CMD', archivo: funciones/desvanecimientos/Calcular_MD.m}
    - {tema: Desvanecimientos, funcion: Calcular_XPD_lluvia, que: 'XPD por lluvia en enlace terrenal', archivo: funciones/desvanecimientos/Calcular_XPD_lluvia.m}
    - {tema: Desvanecimientos, funcion: Calcular_U_equipos, que: 'Indisponibilidad por fallos de equipos en serie', archivo: funciones/desvanecimientos/Calcular_U_equipos.m}
    - {tema: Desvanecimientos, funcion: Calcular_MTTR_max, que: 'MTTR máximo para un objetivo de indisponibilidad', archivo: funciones/desvanecimientos/Calcular_MTTR_max.m}
    - {tema: Desvanecimientos, funcion: Calcular_Disponibilidad, que: 'U_total, disponibilidad y si cumple el objetivo', archivo: funciones/desvanecimientos/Calcular_Disponibilidad.m}
    # ----- Ruido e interferencias -----
    - {tema: Ruido e interferencias, funcion: Calcular_T_cadena, que: 'Temperatura de ruido equivalente de una cadena (Friis)', archivo: funciones/ruido_interferencias/Calcular_T_cadena.m}
    - {tema: Ruido e interferencias, funcion: Calcular_Umbral, que: 'Umbral por ruido TH, ancho de banda y potencia de ruido', archivo: funciones/ruido_interferencias/Calcular_Umbral.m}
    - {tema: Ruido e interferencias, funcion: Calcular_Umbral_referido, que: 'Lleva un umbral a otro punto de la cadena', archivo: funciones/ruido_interferencias/Calcular_Umbral_referido.m}
    - {tema: Ruido e interferencias, funcion: Calcular_Interferencia, que: 'Potencia interferente o despolarizada', archivo: funciones/ruido_interferencias/Calcular_Interferencia.m}
    - {tema: Ruido e interferencias, funcion: Calcular_angulo_triangulo, que: 'Ángulo entre dos lados de un triángulo (teorema del coseno)', archivo: funciones/comunes/Calcular_angulo_triangulo.m}
    # ----- Comunes -----
    - {tema: Comunes, funcion: Vm2dBu, que: 'Campo de V/m a dBµ (20·log10)', archivo: funciones/comunes/Vm2dBu.m}
    - {tema: Comunes, funcion: dBu2Vm, que: 'Campo de dBµ a V/m', archivo: funciones/comunes/dBu2Vm.m}
